spring.application.name=buchsilva_final0

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/buchsilva_final0
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true


# =====================================
# AUTENTICACAO JWT
# =====================================

app.jwt.secret-base64=${BS_JWT_SECRET}

# =====================================
# SENHAS INICIAIS
# =====================================


app.usuarios.admin.senha=${BS_ADMIN_SENHA:}
app.usuarios.visualizador.senha=${BS_VISUALIZADOR_SENHA:}


# =====================================
# COTACOES PROVISORIAS
# =====================================

app.cambio.brl-por-usd=5.38
app.cambio.pyg-por-usd=5890